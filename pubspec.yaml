name: zuraffa_session
description: >-
  Portable browser sessions for the Zuraffa ecosystem: self-contained
  units of webview state (cookies + DOM storage) that persist to a
  relocatable store and reload onto a specific site.
version: 1.1.0
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0

dependencies:
  crypto: ^3.0.6
  json_annotation: ^4.12.0
  zorphy_annotation: ^2.3.0
  zuraffa: ^6.2.2

dev_dependencies:
  build_runner: ^2.16.0
  get_it: ^9.2.1
  json_serializable: ^6.14.1
  lints: ^4.0.0
  mocktail: ^1.0.5
  test: ^1.24.0

repository: https://github.com/arrrrny/zuraffa_session
issue_tracker: https://github.com/arrrrny/zuraffa_session/issues

topics:
  - sessions
  - browser
  - webview
  - cookies
  - zuraffa
