name: zuraffa_session
description: >-
  Portable browser sessions for the Zuraffa ecosystem: self-contained
  units of webview state (cookies + DOM storage) that persist to a
  relocatable store and reload onto a specific site.
version: 7.3.2
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0

dependencies:
  crypto: ^3.0.7
  json_annotation: ^4.12.0
  zorphy_annotation: ^2.4.3
  zuraffa: ^7.3.2

dev_dependencies:
  build_runner: ^2.16.2
  get_it: ^9.3.0
  json_serializable: ^6.14.1
  lints: ^6.1.0
  mocktail: ^1.0.5
  test: ^1.33.0

repository: https://github.com/arrrrny/zuraffa_session
issue_tracker: https://github.com/arrrrny/zuraffa_session/issues

topics:
  - sessions
  - browser
  - webview
  - cookies
  - zuraffa

# Fleet-wide xml policy: pin the override to the latest xml so graphs that
# still transitively pull the abandoned minio (xml 6.x) resolve cleanly.
dependency_overrides:
  xml: 7.1.0
