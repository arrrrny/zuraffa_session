name: zuraffa_session
description: Secure, persistent session management for the Zuraffa ecosystem with encrypted local storage and auth-ready lifecycle hooks.
version: 7.6.1
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0

dependencies:
  crypto: ^3.0.7
  json_annotation: ^4.12.0
  zorphy_annotation: ^2.5.1
  zuraffa: ^7.6.1

dev_dependencies:
  build_runner: ^2.16.2
  get_it: ^9.3.0
  json_serializable: ^6.14.1
  lints: ^6.1.0
  mocktail: ^1.0.5
  test: ^1.33.0

repository: https://github.com/arrrrny/zuraffa_session
issue_tracker: https://github.com/arrrrny/zuraffa_session/issues

topics:
  - sessions
  - browser
  - webview
  - cookies
  - zuraffa

# Fleet-wide xml policy: pin the override to the latest xml so graphs that
# still transitively pull the abandoned minio (xml 6.x) resolve cleanly.
dependency_overrides:
  xml: 7.1.0



